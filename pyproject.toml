[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hermpoint-datagov_jd484"
version = "0.1.0"
description = "按段落统计数据治理与血缘专家·多机通信的带宽瓶颈相关的长度分布，标出过长、过短与重复表达的部分"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "hermpoint" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://hermpoint.github.io"
Repository = "https://github.com/hermpoint/datagov_jd484"
Issues = "https://github.com/hermpoint/datagov_jd484/issues"

[project.scripts]
datagov_jd484 = "datagov_jd484:main"

[tool.setuptools]
py-modules = ["datagov_jd484"]
